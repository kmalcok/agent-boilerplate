[project]
# TR: Proje meta verisi ve bagimliliklar. / EN: Project metadata and dependencies.
name = "agent-boilerplate"
version = "0.1.0"
description = "Production-ready, plug-and-play boilerplate for the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # TR: Cekirdek SDK. / EN: Core SDK.
    "openai-agents>=0.4.2",
    # TR: Ayar yonetimi (env -> typed settings). / EN: Settings management (env -> typed settings).
    "pydantic-settings>=2.5.0",
    # TR: Production HTTP sunucusu. / EN: Production HTTP server.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# TR: Uretim oturum (session) backendleri. / EN: Production session backends.
redis = ["openai-agents[redis]"]
postgres = ["sqlalchemy>=2.0.0", "asyncpg>=0.29.0"]
dev = ["ruff>=0.6.0", "mypy>=1.11.0", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
# TR: `agent-cli` komutu ile interaktif demo. / EN: Interactive demo via `agent-cli`.
agent-cli = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
